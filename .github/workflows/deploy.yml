name: Deploy

# Its own workflow, so pull requests don't list a deploy job that never runs for them.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # Merges to main deploy once every check passes, unless they change only docs, tests, and
  # tooling. The token lives in the production environment, which only main can use.
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # Two commits, so the merge can be compared with the one before it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check whether the merge changes the Worker
        id: scope
        run: node worker/deploy-scope.mjs
      - if: steps.scope.outputs.deploy == 'true'
        run: npm ci
      - name: Deploy the Worker
        if: steps.scope.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN in the production environment, so nothing was deployed."
            exit 0
          fi
          npm run deploy:api
