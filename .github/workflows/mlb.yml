name: MLB check

# Catches a change to MLB's Stats API, or a connector that stopped answering,
# before a game night does.
on:
  schedule:
    - cron: "47 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:mlb
        env:
          CONNECTOR_URL: ${{ vars.CONNECTOR_URL }}
